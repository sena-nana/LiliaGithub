title = "LiliaGithub"
bundle = "dist/lilia-github.iife.js"
default_page = "home"
theme = "light"
# Chrome: Nana host AppTitleBar only. NanaAppRoot sets data-nana-host-chrome
# and does not mount Lilia TitleBar (avoids dual 36px strips on home/settings).

[pages]
home = "__nanaLiliaRunHome"
settings = "__nanaLiliaRunSettings"
settings-account = "__nanaLiliaRunSettingsAccount"
settings-workspace = "__nanaLiliaRunSettingsWorkspace"
settings-about = "__nanaLiliaRunSettingsAbout"
profile = "__nanaLiliaRunProfile"
repo = "__nanaLiliaRunRepo"
